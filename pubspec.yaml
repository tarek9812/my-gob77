name: shadow_shat
description: "Shadow Chat - BETA experimental release."
publish_to: 'none'

version: 1.0.0-beta.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  video_player: ^2.9.2
  cryptography: ^2.7.0
  record: ^7.1.1
  image_picker: ^1.1.2
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  firebase_ai: ^2.3.0
  firebase_messaging: ^15.2.10
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.5
  shared_preferences: ^2.5.3
  flutter_contacts: ^2.3.1
  path_provider: ^2.1.5
  http: ^1.3.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/whale.jpg
    - assets/images/forest_safe_haven.jpg
    - assets/images/forest_fog.jpg
    - assets/images/forest_glowing_eyes.jpg
    - assets/images/forest_dawn.jpg
    - assets/images/shadow_avatar.jpg
    - assets/images/forest_entry.jpg
    - assets/images/IMG-20261006-WA0558.jpg
    - assets/images/IMG-20261006-WA7008.jpg
    - assets/audio/whale_sound.mp3